<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Crypto Toolkit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #f0f0f0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 16px 20px 12px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #1a1a1a;
        }
        .header h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.3px; }
        .header h1 span { color: #22c55e; }
        .header .updated { font-size: 0.7rem; color: #737373; }

        .main { flex: 1; overflow-y: auto; padding: 16px 16px 24px; }

        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        .btn {
            width: 100%; background: #22c55e; color: #000; border: none;
            border-radius: 12px; padding: 15px; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; }
        .btn.orange { background: #f97316; }

        .field { width: 100%; margin-bottom: 10px; }
        .field label { display: block; font-size: 0.8rem; color: #9aa3b2; margin-bottom: 6px; }
        .field input {
            width: 100%; background: #161a21; border: 1px solid #2a2f3a; color: #f0f0f0;
            border-radius: 10px; padding: 13px 14px; font-size: 0.9rem; outline: none;
        }
        .field input:focus { border-color: #22c55e; }

        .card {
            background: #161a21; border: 1px solid #2a2f3a; border-radius: 12px;
            padding: 14px; margin-bottom: 10px;
        }
        .card .row1 { display: flex; justify-content: space-between; align-items: baseline; }
        .card .sym { font-weight: 700; font-size: 1rem; }
        .card .sym small { color: #737373; font-weight: 400; font-size: 0.75rem; }
        .card .chg { font-weight: 700; font-size: 0.95rem; }
        .card .chg.up { color: #22c55e; }
        .card .chg.down { color: #ef4444; }
        .card .row2 {
            display: flex; justify-content: space-between; margin-top: 8px;
            font-size: 0.78rem; color: #9aa3b2;
        }
        .card .addr {
            font-size: 0.65rem; color: #525252; margin-top: 6px;
            word-break: break-all; font-family: 'Courier New', monospace;
        }

        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1a1a1a; }
        .stat-row .k { color: #9aa3b2; font-size: 0.85rem; }
        .stat-row .v { font-weight: 700; font-size: 0.9rem; }
        .flag { padding: 8px 12px; border-radius: 8px; margin-top: 8px; font-size: 0.8rem; }
        .flag.warn { background: #2a1a00; color: #fbbf24; border: 1px solid #fbbf2433; }
        .flag.good { background: #052e16; color: #22c55e; border: 1px solid #22c55e33; }

        .msg { color: #9aa3b2; font-size: 0.85rem; line-height: 1.6; padding: 8px 2px; }
        .msg.error { color: #f87171; }

        .section { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #737373; margin: 18px 0 8px; }

        .nav {
            display: flex; background: #161a21; border-top: 1px solid #2a2f3a;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav button {
            flex: 1; background: none; border: none; color: #737373;
            padding: 12px 4px 10px; font-size: 0.68rem; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            cursor: pointer; transition: 0.2s;
        }
        .nav button .ic { font-size: 1.3rem; }
        .nav button.active { color: #22c55e; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Crypto <span>Toolkit</span></h1>
        <div class="updated" id="updated">—</div>
    </div>

    <div class="main" id="main">

        <div class="panel active" id="panel-scan">
            <button class="btn" id="scan-btn" onclick="runScan()">🚀 Run Pump.fun Scan</button>
            <div class="section">Momentum signals</div>
            <div id="scan-results"><p class="msg">Tap the button to scan pump.fun for tokens passing the momentum filters (MC 5K–100K, liquidity, net 1h buys, 1h gain).</p></div>
        </div>

        <div class="panel" id="panel-whale">
            <div class="field">
                <label>Token Mint Address</label>
                <input id="whale-input" placeholder="e.g. ...pump" inputmode="url" autocomplete="off">
            </div>
            <button class="btn" id="whale-btn" onclick="runWhale()">🐋 Check Wallet Distribution</button>
            <div id="whale-results" style="margin-top:14px;"><p class="msg">Paste a token mint (ends in "pump") to see how concentrated the top holders are.</p></div>
        </div>

        <div class="panel" id="panel-leaders">
            <button class="btn orange" id="leaders-btn" onclick="runLeaders()">🏆 Load Top Traders</button>
            <div id="leaders-results" style="margin-top:14px;"><p class="msg">Pulls the top pump.fun traders by 30-day profit from KOLscan.</p></div>
        </div>

    </div>

    <div class="nav">
        <button class="active" onclick="switchTab('scan')"><span class="ic">🚀</span>Scan</button>
        <button onclick="switchTab('whale')"><span class="ic">🐋</span>Whale</button>
        <button onclick="switchTab('leaders')"><span class="ic">🏆</span>Leaders</button>
    </div>

    <script>
        function switchTab(name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function setUpdated() {
            const d = new Date();
            const t = d.toTimeString().slice(0, 5);
            document.getElementById('updated').textContent = 'Updated ' + t;
        }

        function fmtMoney(n) {
            if (n == null) return 'N/A';
            if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return '$' + Math.round(n).toLocaleString();
            return '$' + n.toFixed(2);
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function runScan() {
            const btn = document.getElementById('scan-btn');
            const out = document.getElementById('scan-results');
            btn.disabled = true; btn.textContent = 'Scanning...';
            out.innerHTML = '<p class="msg">Fetching pump.fun profiles...</p>';
            try {
                const profiles = await (await fetch('https://api.dexscreener.com/token-profiles/latest/v1')).json();
                const addrs = profiles
                    .filter(p => p.tokenAddress && p.tokenAddress.endsWith('pump') && p.tokenAddress.length > 30)
                    .map(p => p.tokenAddress).slice(0, 15);

                if (!addrs.length) { out.innerHTML = '<p class="msg">No pump.fun tokens in the latest profiles.</p>'; return; }

                out.innerHTML = '<p class="msg">Checking ' + addrs.length + ' tokens...</p>';
                const results = [];
                for (const a of addrs) {
                    try {
                        const d = await (await fetch('https://api.dexscreener.com/latest/dex/tokens/' + a)).json();
                        if (d.pairs && d.pairs.length) {
                            const p = d.pairs[0];
                            const mc = p.marketCap || 0;
                            const liq = (p.liquidity && p.liquidity.usd) || 0;
                            const vol = (p.volume && p.volume.h24) || 0;
                            const h1 = (p.txns && p.txns.h1) || {};
                            const net1h = (h1.buys || 0) - (h1.sells || 0);
                            const pc1h = (p.priceChange && p.priceChange.h1) || 0;
                            if (mc >= 5000 && mc <= 100000 && liq > 5000 && net1h > 0 && pc1h > 0) {
                                results.push({
                                    sym: (p.baseToken && p.baseToken.symbol) || '?',
                                    name: (p.baseToken && p.baseToken.name) || '?',
                                    mc: mc, liq: liq, vol: vol, net1h: net1h, pc1h: pc1h, addr: a
                                });
                            }
                        }
                    } catch (e) {}
                    await sleep(150);
                }
                results.sort((a, b) => a.mc - b.mc);

                if (!results.length) {
                    out.innerHTML = '<p class="msg">No tokens pass all filters right now. Market\u2019s quiet \u2014 same as the scanner finding nothing.</p>';
                } else {
                    out.innerHTML = results.map(r => (
                        '<div class="card">' +
                        '<div class="row1"><span class="sym">' + r.sym + ' <small>' + r.name + '</small></span>' +
                        '<span class="chg up">+' + r.pc1h.toFixed(2) + '%</span></div>' +
                        '<div class="row2"><span>MC: ' + fmtMoney(r.mc) + '</span><span>Net 1h: +' + r.net1h + '</span><span>Liq: ' + fmtMoney(r.liq) + '</span></div>' +
                        '<div class="addr">' + r.addr + '</div>' +
                        '</div>'
                    )).join('');
                }
            } catch (e) {
                out.innerHTML = '<p class="msg error">Scan failed: ' + e.message + '</p>';
            } finally {
                btn.disabled = false; btn.textContent = '🚀 Run Pump.fun Scan';
                setUpdated();
            }
        }

        const RPC = 'https://api.mainnet-beta.solana.com';

        async function rpcCall(method, params) {
            const r = await fetch(RPC, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: method, params: params })
            });
            const j = await r.json();
            if (j.error) throw new Error(j.error.message);
            return j.result;
        }

        async function runWhale() {
            const btn = document.getElementById('whale-btn');
            const out = document.getElementById('whale-results');
            const mint = document.getElementById('whale-input').value.trim();
            if (!mint) { out.innerHTML = '<p class="msg error">Paste a token mint first.</p>'; return; }

            btn.disabled = true; btn.textContent = 'Checking...';
            out.innerHTML = '<p class="msg">Fetching supply and holders...</p>';
            try {
                const supply = await rpcCall('getTokenSupply', [mint]);
                const total = supply.value.amount / Math.pow(10, supply.value.decimals);
                const accts = await rpcCall('getTokenLargestAccounts', [mint]);
                const amounts = accts.value.map(h =>
                    h.uiAmount != null ? h.uiAmount : h.amount / Math.pow(10, supply.value.decimals)
                );

                const p1 = amounts[0] / total * 100;
                const p5 = amounts.slice(0, 5).reduce((a, b) => a + b, 0) / total * 100;
                const p10 = amounts.slice(0, 10).reduce((a, b) => a + b, 0) / total * 100;

                let flags = [];
                if (p1 > 10) flags.push('Top wallet holds ' + p1.toFixed(1) + '% \u2014 one whale controls price');
                else if (p1 > 5) flags.push('Top wallet holds ' + p1.toFixed(1) + '% \u2014 worth watching');
                if (p5 > 25) flags.push('Top 5 hold ' + p5.toFixed(1) + '% \u2014 heavily concentrated');
                if (p10 > 40) flags.push('Top 10 hold ' + p10.toFixed(1) + '% \u2014 very tight distribution');

                let html = '';
                html += '<div class="card">' +
                    '<div class="stat-row"><span class="k">Total supply</span><span class="v">' + fmtMoney(total) + '</span></div>' +
                    '<div class="stat-row"><span class="k">Top 1 holder</span><span class="v">' + p1.toFixed(1) + '%</span></div>' +
                    '<div class="stat-row"><span class="k">Top 5 holders</span><span class="v">' + p5.toFixed(1) + '%</span></div>' +
                    '<div class="stat-row"><span class="k">Top 10 holders</span><span class="v">' + p10.toFixed(1) + '%</span></div>' +
                    '</div>';

                if (flags.length) {
                    html += flags.map(f => '<div class="flag warn">⚠️ ' + f + '</div>').join('');
                    html += '<p class="msg">Verdict: proceed carefully, or skip.</p>';
                } else {
                    html += '<div class="flag good">✅ Distribution looks healthy.</div>';
                }
                out.innerHTML = html;
            } catch (e) {
                out.innerHTML = '<p class="msg error">Whale check failed: ' + e.message + '</p>';
            } finally {
                btn.disabled = false; btn.textContent = '🐋 Check Wallet Distribution';
                setUpdated();
            }
        }

        async function runLeaders() {
            const btn = document.getElementById('leaders-btn');
            const out = document.getElementById('leaders-results');
            btn.disabled = true; btn.textContent = 'Loading...';
            out.innerHTML = '<p class="msg">Fetching leaderboard...</p>';
            try {
                const html = await (await fetch('https://api.allorigins.win/raw?url=https://kolscan.io/leaderboard')).text();
                const re = /\{\\"wallet_address\\":\\"([^\\]+)\\",\\"name\\":\\"([^\\]*)\\",\\"telegram\\":([^,]+),\\"twitter\\":([^,]+),\\"profit\\":([\d.eE+-]+),\\"wins\\":(\d+),\\"losses\\":(\d+),\\"timeframe\\":(\d+)\}/g;
                const traders = [];
                let m;
                while ((m = re.exec(html)) !== null) {
                    if (m[8] === '30') {
                        traders.push({ name: m[2] || m[1].slice(0, 6), profit: parseFloat(m[5]), wins: +m[6], losses: +m[7] });
                    }
                }
                traders.sort((a, b) => b.profit - a.profit);
                if (!traders.length) { out.innerHTML = '<p class="msg">No leaderboard data found.</p>'; return; }
                out.innerHTML = traders.slice(0, 15).map((t, i) => (
                    '<div class="card">' +
                    '<div class="row1"><span class="sym">#' + (i + 1) + ' ' + t.name + '</span>' +
                    '<span class="chg up">' + t.profit.toFixed(0) + ' SOL</span></div>' +
                    '<div class="row2"><span>Wins: ' + t.wins + '</span><span>Losses: ' + t.losses + '</span></div>' +
                    '</div>'
                )).join('');
            } catch (e) {
                out.innerHTML =
                    '<p class="msg error">Browser blocked the fetch: ' + e.message + '</p>' +
                    '<p class="msg">KOLscan blocks cross-origin requests, so this tab needs the tablet\u2019s Termux script (<b>kolscan_tracker.py</b>) instead \u2014 it scrapes the same leaderboard and Telegram-alerts you on top-trader buys. When your server is up, this tab points at your dashboard and works everywhere.</p>';
            } finally {
                btn.disabled = false; btn.textContent = '🏆 Load Top Traders';
                setUpdated();
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
